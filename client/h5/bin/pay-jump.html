<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>跳转中...</title>
</head>
<body>
<script>
  // 支付中转页：从 URL 参数读取 target，跳转过去，让目标页面看到的 Referer 为本页面地址
  (function () {
    var target = new URLSearchParams(window.location.search).get('target');
    if (target) {
      window.location.replace(target);
    }
  })();
</script>
</body>
</html>
