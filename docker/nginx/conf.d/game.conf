server {
    listen 80;
    server_name game.rqsr888.cn;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name game.rqsr888.cn;
    root /home/game-www;
    index index.html;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /api/   { proxy_pass http://backend:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /admin/ { proxy_pass http://backend:8897/; proxy_set_header Host $host; }
    location ^~ /gm/    { proxy_pass http://backend:8898/; proxy_set_header Host $host; }
    location ~* ^/(promo/logo\.png|resource/game/login/texture/(logo|ui_Login_logo)\.png|resource/config/client/ConfigAgreement[0-9A-Za-z_]*\.json|resource/config/client/ClientConfig\.json|resource/game/login/LoginBgView\.json|resource/UIConfig\.json)$ {
        expires -1; add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; }
    location / { try_files $uri $uri/ /index.html; }
}
