server {
    listen 80;
    server_name pay.rqsr888.cn;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name pay.rqsr888.cn;
    root /home/game-www;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /pay/      { proxy_pass http://backend:8896/; proxy_set_header Host $host; }
    location ^~ /api/      { proxy_pass http://backend:8899; proxy_set_header Host $host; }
    location ^~ /recharge/ { }
    location = / { return 302 /recharge/index.html; }
}
