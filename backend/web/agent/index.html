<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>代理推广</title>
<style>
body{margin:0;background:#0b1020;color:#e8e6f0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px 28px}
.card{background:linear-gradient(180deg,#151b34,#1a2140);border:1px solid #2a3456;border-radius:16px;padding:18px 16px}
h1{font-size:20px;text-align:center;color:#f3e7c4;margin:4px 0 14px}
.row{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px dashed #2a3456;font-size:14px}
.row span{color:#8f9cc0}.row b{word-break:break-all;text-align:right}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:#3a2c00;background:linear-gradient(180deg,#f4dd9a,#e3b955);cursor:pointer;text-align:center;text-decoration:none}
.btn.sec{background:#243050;color:#cfe;font-weight:500}
.tip{font-size:13px;color:#7ee2a8;text-align:center;margin-top:10px;min-height:18px}
</style></head><body>
<div class="wrap"><div class="card">
<h1>非凡仙途 · 推广中心</h1>
<div class="row"><span>推广码</span><b id="code">-</b></div>
<div class="row"><span>专属注册链接</span><b id="link" style="font-size:12px">-</b></div>
<button class="btn" onclick="copyLink()">复制推广链接</button>
<a class="btn sec" id="go" href="https://game.yb668.xyz/">进入游戏</a>
<div class="tip" id="tip"></div>
</div><div style="text-align:center;font-size:12px;color:#8a93b2;padding:16px 10px;line-height:1.8">运营单位：南京蓝熠博科技有限公司&nbsp;&nbsp;<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#8a93b2">苏ICP备2025224826号-1</a></div></div>
<script>
var q=new URLSearchParams(location.search);
var code=(q.get('code')||'').trim();
document.getElementById('code').textContent = code || '（未带推广码）';
var link = code ? (location.origin + '/register/?agent=' + encodeURIComponent(code)) : (location.origin + '/register/');
document.getElementById('link').textContent = link;
function copyLink(){
  navigator.clipboard.writeText(link).then(function(){document.getElementById('tip').textContent='已复制推广链接';})
  .catch(function(){document.getElementById('tip').textContent=link;});
}
</script></body></html>
