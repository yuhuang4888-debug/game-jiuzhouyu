<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>九州谕充值中心</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0b1020;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#e8e6f0}
  .wrap{max-width:480px;margin:0 auto;padding:16px 14px 28px}
  .card{background:linear-gradient(180deg,#151b34,#1a2140);border:1px solid #2a3456;border-radius:16px;padding:16px 14px;margin-bottom:14px}
  .title{text-align:center;font-size:22px;font-weight:700;color:#f3e7c4;letter-spacing:2px;margin:6px 0 14px;text-shadow:0 0 12px rgba(240,210,140,.25)}
  .role{font-size:14px;color:#aab4d4;margin-bottom:6px}
  .role b{color:#e8e6f0;font-weight:600}
  .sec{font-size:13px;color:#8f9cc0;margin:12px 0 8px}
  .amount{background:#0f1428;border:1px solid #2f3a5e;border-radius:12px;text-align:center;padding:16px;font-size:26px;font-weight:700;color:#fff}
  .amount span{font-size:18px;color:#f3d98a}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{background:#0f1428;border:1px solid #2f3a5e;border-radius:12px;padding:16px;text-align:center;font-size:17px;color:#dfe4f5;cursor:pointer;transition:.15s}
  .btn.on{border-color:#e9c96a;background:#1c2340;color:#f3d98a;box-shadow:0 0 0 1px #e9c96a inset}
  .btn.wide{grid-column:1/3}
  .pay{display:flex;align-items:center;background:#0f1428;border:1px solid #2f3a5e;border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .pay.on{border-color:#e9c96a;background:#1c2340}
  .pay .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-right:10px;font-size:16px}
  .ic.ali{background:#1677ff}.ic.wx{background:#07c160}
  .pay .nm{font-size:15px;font-weight:600}
  .pay .ds{font-size:12px;color:#8f9cc0}
  .pay .rd{width:18px;height:18px;border-radius:50%;border:2px solid #54608a;margin-left:auto;flex:none}
  .pay.on .rd{border-color:#e9c96a;background:radial-gradient(circle,#e9c96a 45%,transparent 50%)}
  .agree{display:flex;align-items:center;font-size:13px;color:#aab4d4;margin:6px 0 14px}
  .agree input{width:16px;height:16px;margin-right:8px;accent-color:#e9c96a}
  .agree a{color:#7fb0ff;text-decoration:none}
  .submit{display:block;width:100%;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:700;color:#3a2c00;
    background:linear-gradient(180deg,#f4dd9a,#e3b955);cursor:pointer}
  .submit:disabled{opacity:.5}
  .tip{color:#f0a5a5;font-size:13px;min-height:18px;text-align:center;margin-bottom:6px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
  .modal.on{display:flex}
  .mbox{background:#151b34;border:1px solid #2a3456;border-radius:14px;max-width:380px;width:100%;padding:18px;max-height:74vh;overflow:auto}
  .mbox h3{margin:0 0 10px;color:#f3e7c4;font-size:16px}
  .mbox p{font-size:13px;color:#b9c2dd;line-height:1.7;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="title" id="shopName">九州谕充值中心</div>
    <div class="role">角色名称：<b id="roleName">—</b>　　游戏区：<b id="serverId">1</b></div>

    <div class="sec">充值金额</div>
    <div class="amount"><span>¥</span><span id="curAmount">6</span></div>

    <div class="sec">快捷充值</div>
    <div class="grid" id="quick"></div>

    <div class="sec">支付方式</div>
    <div class="pay on" data-pay="alipay">
      <div class="ic ali">支</div>
      <div><div class="nm">支付宝</div><div class="ds">推荐移动端直接拉起支付</div></div>
      <div class="rd"></div>
    </div>
    <div class="pay" data-pay="wechat">
      <div class="ic wx">微</div>
      <div><div class="nm">微信支付</div><div class="ds">适合微信内或扫码支付</div></div>
      <div class="rd"></div>
    </div>

    <div class="sec">充值协议</div>
    <div class="agree"><input type="checkbox" id="agree"><label for="agree">我已阅读并同意 <a href="javascript:;" id="showAgree">《充值服务协议》</a></label></div>
    <div class="tip" id="tip"></div>
    <button class="submit" id="payBtn">立即支付 ¥6</button>
  </div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <h3>充值服务协议</h3>
  <p>1. 本充值服务由游戏运营方提供，充值成功后对应货币将发放至您当前角色。</p>
  <p>2. 虚拟货币一经充值，非因服务方原因不予退换。</p>
  <p>3. 未成年人应在监护人陪同下充值，并遵守相关防沉迷规定。</p>
  <p>4. 如遇充值未到账，请保留支付订单号并联系客服处理。</p>
  <div style="text-align:center;margin-top:12px"><button class="submit" style="width:auto;padding:10px 26px" onclick="document.getElementById('modal').classList.remove('on')">我知道了</button></div>
</div></div>

<script>
var Q = new URLSearchParams(location.search);
var roleName = Q.get('name') || Q.get('role') || '';
var serverId = Q.get('sid') || Q.get('server') || '1';
var account  = Q.get('acc') || Q.get('account') || '';
document.getElementById('roleName').textContent = roleName || '（未命名）';
document.getElementById('serverId').textContent = serverId;

var QUICK = [6, 30, 68, 128, 198, 328];
var amounts = QUICK.slice();
var _m0 = parseInt(Q.get('money') || '0', 10);
var curAmount = _m0 > 0 ? _m0 : 6;
var curPay = 'alipay';
var CH = {alipay: 1, wechat: 0};
var custom = (_m0 > 0 && QUICK.indexOf(_m0) < 0) ? 1 : 0;

function renderQuick(){
  var h = '';
  amounts.forEach(function(a){ h += '<div class="btn'+(a===curAmount?' on':'')+'" data-a="'+a+'">'+a+'</div>'; });
  h += '<div class="btn wide'+(custom?' on':'')+'" id="customBtn">自定义充值</div>';
  document.getElementById('quick').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('#quick .btn[data-a]'), function(el){
    el.onclick = function(){ custom = 0; curAmount = parseInt(el.getAttribute('data-a'),10); renderQuick(); refresh();
fetch('/api/api.php?method=pay_channels').then(function(r){ return r.json(); }).then(function(d){
  if(d && d.ret === 0){
    CH.alipay = d.alipay ? 1 : 0; CH.wechat = d.wechat ? 1 : 0;
    Array.prototype.forEach.call(document.querySelectorAll('.pay'), function(el){
      var k = el.getAttribute('data-pay');
      if(!CH[k]){ el.style.opacity = 0.5; var ds = el.querySelector('.ds'); if(ds) ds.textContent = (k==='wechat' ? '\u6682\u65f6\u672a\u5f00\u901a\u5fae\u4fe1\u652f\u4ed8' : '\u6682\u65f6\u672a\u5f00\u901a'); }
    });
    if(!CH[curPay] && CH.alipay){ curPay = 'alipay'; var a = document.querySelector('.pay[data-pay="alipay"]'); if(a) a.classList.add('on'); }
  }
}); };
  });
  document.getElementById('customBtn').onclick = function(){
    var v = prompt('请输入充值金额（元）', curAmount);
    if(v===null) return;
    v = parseInt(v,10);
    if(!v || v<1 || v>50000){ alert('请输入 1 - 50000 之间的金额'); return; }
    custom = 1; curAmount = v; renderQuick(); refresh();
  };
}
function refresh(){
  document.getElementById('curAmount').textContent = curAmount;
  document.getElementById('payBtn').textContent = '立即支付 ¥' + curAmount;
}
Array.prototype.forEach.call(document.querySelectorAll('.pay'), function(el){
  el.onclick = function(){
    var k = el.getAttribute('data-pay');
    var tip = document.getElementById('tip');
    if(!CH[k]){ tip.style.color='#f0c060'; tip.textContent = (k==='wechat' ? '\u6682\u65f6\u672a\u5f00\u901a\u5fae\u4fe1\u652f\u4ed8' : '\u8be5\u652f\u4ed8\u65b9\u5f0f\u6682\u65f6\u672a\u5f00\u901a'); return; }
    Array.prototype.forEach.call(document.querySelectorAll('.pay'), function(x){ x.classList.remove('on'); });
    el.classList.add('on'); curPay = k;
    tip.style.color = '#f0a5a5'; tip.textContent = '';
  };
});
document.getElementById('showAgree').onclick = function(){ document.getElementById('modal').classList.add('on'); };
document.getElementById('payBtn').onclick = function(){
  var tip = document.getElementById('tip');
  tip.style.color = '#f0a5a5';
  tip.textContent = '';
  if(!document.getElementById('agree').checked){ tip.textContent = '请先阅读并勾选《充值服务协议》'; return; }
  if(!roleName){ tip.textContent = '缺少角色信息（请从游戏内进入充值页）'; return; }
  if(!CH[curPay]){ tip.style.color='#f0c060'; tip.textContent = (curPay==='wechat' ? '\u6682\u65f6\u672a\u5f00\u901a\u5fae\u4fe1\u652f\u4ed8' : '\u8be5\u652f\u4ed8\u65b9\u5f0f\u6682\u65f6\u672a\u5f00\u901a'); return; }
  var btn = this; btn.disabled = true; btn.textContent = '正在创建订单...';
  var body = 'method=create_order&role=' + encodeURIComponent(roleName) + '&sid=' + encodeURIComponent(serverId)
           + '&acc=' + encodeURIComponent(account) + '&money=' + curAmount + '&paytype=' + curPay;
  fetch('/api/api.php', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ret === 0 && d.pay_url){ location.href = d.pay_url; return; }
      tip.textContent = (d && d.msg) ? d.msg : '下单失败，请稍后再试';
      btn.disabled = false; btn.textContent = '立即支付 ¥' + curAmount;
    })
    .catch(function(){ tip.textContent = '网络异常，请稍后再试'; btn.disabled = false; btn.textContent = '立即支付 ¥' + curAmount; });
};
renderQuick(); refresh();
</script>
</body>
</html>
